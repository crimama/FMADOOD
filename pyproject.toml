[project]
name = "fsad-tta"
version = "0.1.0"
description = "Controlled few-shot anomaly detection experiments with swappable methods."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.4",
    "PyYAML>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
model = [
    "torch>=2.2",
    "torchvision>=0.17",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "tqdm>=4.64",
]
cpu = ["fsad-tta[model]", "faiss-cpu>=1.7.4"]
dev = [
    "basedpyright>=1.31",
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
fmad-run = "fmad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmad"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "D100",
    "D104",
    "D203",
    "D212",
    "EM101",
    "FBT001",
    "FBT002",
    "PLR0402",
    "PLR2004",
    "TC001",
    "TC002",
    "TRY003",
    "T201",
    "UP006",
    "UP037",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.basedpyright]
include = ["src/fmad"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "all"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnusedCallResult = false
