method: tail_aware_fusion
dataset: mvtec_ad2
backbone: dinov2_vitl14
seed: 0
device: cuda:0
dataset_config: {preprocess: no_mask_no_rotation}
backbone_config: {smaller_edge_size: 448, feature_layers: [11, 23]}
protocol: {shots: 16, warmup_iters: 1}
method_config:
  variant: R1
  feature_layers: [11, 23]
  resolutions: [448, 672]
  bank_tokens_per_source: 256
  query_chunk_size: 128
  learn_fusion: true
  hard_normal_ranking: true
  local_fusion: true
  fusion_bound: 0.5
  fusion_chunk_size: 4096
  steps: 64
  normal_candidates: 4096
  normal_tail_fraction: 0.05
  train_tokens: 128
  learning_rate: 0.01
  margin: 0.5
  pair_weight: 0.1
evaluation:
  streaming: true
  inference_batch_size: 1
  metric_contract: mvtec_ad2_float16_streaming_v1
  eval_segm: true
  eval_clf: false
  pro_integration_limit: 0.05
output: {save_anomaly_maps: false, save_weights: false}
