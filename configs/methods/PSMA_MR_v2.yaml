# Approved PSMA_MR v2 dsba1 configuration.
# Set data_root via --data-root or add it below before running run.py.

method: PSMA_MR
dataset: mvtec_ad2
backbone: dinov2_vitl14

# data_root: /path/to/mvtec_ad_2    # REQUIRED — set via --data-root or override here
output_dir: ./results
seed: 0
device: "cuda:0"

dataset_config:
  # v2 is an explicit no-mask/no-rotation ablation relative to v1 agnostic.
  preprocess: no_mask_no_rotation

backbone_config:
  smaller_edge_size: 448
  feature_layers: [5, 11, 17, 23]

protocol:
  shots: 16
  fixed_reference_manifest: null
  warmup_iters: 25

method_config:
  revision: v2
  adapter_enabled: true
  adapter_rank: 4
  residual_epsilon: 0.10
  resolutions: [448, 672]
  final_bank_cap: 256
  intermediate_bank_cap: 128
  train_tokens: 96
  steps: 32
  learning_rate: 0.001
  weight_decay: 0.0
  margin: 0.10
  normal_consistency_weight: 1.0
  local_weight: 1.0
  feature_anchor_weight: 0.10
  gradient_clip: 5.0
  nn_chunk_size: 1024

evaluation:
  streaming: true
  inference_batch_size: 1
  metric_contract: mvtec_ad2_float16_streaming_v1
  eval_segm: true
  eval_clf: false
  pro_integration_limit: 0.05

debug_output: false

output:
  save_anomaly_maps: false
  save_weights: false
