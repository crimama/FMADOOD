method: contextual_score
dataset: mvtec_ad2
backbone: dinov2_vitl14
seed: 0
device: cuda:0
dataset_config:
  preprocess: no_mask_no_rotation
backbone_config:
  smaller_edge_size: 448
  feature_layers: [23]
protocol:
  shots: 16
  warmup_iters: 1
method_config:
  score_head: true
  context_matching: false
  correspondence_training: false
  resolutions: [448, 672]
  steps: 64
  bank_tokens_per_source: 256
  train_tokens: 128
  candidate_count: 8
  query_chunk_size: 128
  hidden_dim: 64
  learning_rate: 0.001
  correspondence_weight: 0.1
evaluation:
  streaming: true
  inference_batch_size: 1
  metric_contract: mvtec_ad2_float16_streaming_v1
  eval_segm: true
  eval_clf: false
  pro_integration_limit: 0.05
output:
  save_anomaly_maps: false
  save_weights: false
