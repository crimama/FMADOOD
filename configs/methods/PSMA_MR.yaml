# FMAD-OOD PSMA_MR configuration.
# Set data_root via --data-root or add it below before running run.py.

method: PSMA_MR
dataset: mvtec_ad2
backbone: dinov2_vitl14

# data_root: /path/to/mvtec_ad_2    # REQUIRED — set via CLI or override here
output_dir: ./results
seed: 0
device: "cuda:0"

dataset_config:
  preprocess: agnostic

protocol:
  shots: 16
  fixed_reference_manifest: null
  warmup_iters: 25

method_config:
  adapter_enabled: true
  resolutions: [448, 672]
  adapter_rank: 4
  steps: 24
  learning_rate: 0.001

evaluation:
  streaming: true
  inference_batch_size: 1
  metric_contract: mvtec_ad2_float16_streaming_v1
  eval_segm: true
  eval_clf: false
  pro_integration_limit: 0.05

debug_output: false

output:
  save_anomaly_maps: false
  save_weights: false
