method: reverse_distillation
dataset: mvtec_ad2
backbone: dinov2_vitl14
seed: 0
device: cuda:0
dataset_config: {preprocess: no_mask_no_rotation}
backbone_config: {smaller_edge_size: 448, feature_layers: [11, 23]}
protocol: {shots: 16, warmup_iters: 1}
method_config:
  teacher: wrn50
  teacher_weights: /model-cache/hub/checkpoints/wide_resnet50_2-95faca4d.pth
  resolution: 1024
  train_resolution: 1024
  crop_size: 512
  steps: 1500
  batch_size: 8
  learning_rate: 0.005
  bottleneck_channels: 512
  photometric_strength: 1.0
  flips: true
evaluation:
  streaming: true
  inference_batch_size: 1
  metric_contract: mvtec_ad2_float16_streaming_v1
  eval_segm: true
  eval_clf: false
  pro_integration_limit: 0.05
output: {save_anomaly_maps: false, save_weights: false}
