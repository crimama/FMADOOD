method: reference_matching
dataset: mvtec_ad2
backbone: dinov2_vitl14
seed: 0
dataset_config:
  preprocess: no_mask_no_rotation
backbone_config:
  smaller_edge_size: 672
  feature_layers: [11, 23]
protocol:
  shots: 16
  warmup_iters: 1
  fixed_reference_manifest: configs/methods/VOID_support_16.json
method_config:
  variant: R1
  feature_layers: [11, 23]
  resolutions: [448, 672, 896, 1120]
  bank_tokens_per_source: 256
  query_chunk_size: 128
  bank_bags: 4
  knn_k: 1
  score_normalization: tailscale
  layer_fusion: mean
  prediction_postprocess: component_quantile
  component_percentile: 99.0
  component_q: 1.0
  component_dilate_size: 0
  noise_guard: false
evaluation:
  streaming: true
  inference_batch_size: 1
  metric_contract: mvtec_ad2_float16_streaming_v1
  eval_segm: true
  eval_clf: false
  pro_integration_limit: 0.05
  cost_profile: true
  fusion_diagnostic: false
  condition_strata: false
output:
  save_anomaly_maps: false
  save_weights: false
