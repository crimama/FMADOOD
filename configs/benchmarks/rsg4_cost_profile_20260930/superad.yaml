method: superad
dataset: mvtec_ad2
backbone: dinov2_vitl14
seed: 0
dataset_config:
  preprocess: no_mask_no_rotation
backbone_config:
  smaller_edge_size: 672
  feature_layers: [5, 11, 17, 23]
protocol:
  shots: 16
  warmup_iters: 1
  fixed_reference_manifest: configs/methods/VOID_support_16.json
method_config:
  knn_metric: L2_normalized
  k_neighbors: 1
  faiss_on_cpu: false
  mask_ref_images: false
evaluation:
  streaming: true
  inference_batch_size: 1
  metric_contract: mvtec_ad2_float16_streaming_v1
  eval_segm: true
  eval_clf: false
  pro_integration_limit: 0.05
  cost_profile: true
  fusion_diagnostic: false
  condition_strata: false
  binary_postprocess: none
output:
  save_anomaly_maps: false
  save_weights: false
