method: patchcore
dataset: mvtec
backbone: dinov2_vitl14
seed: 0
dataset_config: {preprocess: no_mask_no_rotation}
backbone_config: {smaller_edge_size: 672, feature_layers: [5, 11, 17, 23]}
protocol: {shots: 16, fixed_reference_manifest: null, warmup_iters: 2}
method_config:
  coreset_sampling_ratio: 1.0
  knn_metric: L2_normalized
  k_neighbors: 1
  faiss_on_cpu: false
evaluation:
  streaming: true
  inference_batch_size: 1
  metric_contract: mvtec_ad2_float16_streaming_v1
  eval_segm: true
  eval_clf: false
  pro_integration_limit: 0.05
  binary_postprocess: none
output: {save_anomaly_maps: false, save_weights: false}
