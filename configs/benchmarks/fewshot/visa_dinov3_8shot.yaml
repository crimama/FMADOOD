method: reference_matching
dataset_config:
  preprocess: no_mask_no_rotation
backbone_config:
  smaller_edge_size: 448
  feature_layers:
  - 5
  - 11
  - 23
method_config:
  variant: R1
  feature_layers:
  - 5
  - 11
  - 23
  resolutions:
  - 448
  - 672
  - 896
  - 1120
