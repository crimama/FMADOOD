# FastRecon paper-faithful adapter: ResNet-50/368, lambda=0.3, 15% coreset.
method: fastrecon_paper
dataset: mvtec_ad2
backbone: fastrecon_resnet50
seed: 1
device: cuda:0
dataset_config:
  objects: [can, fabric, fruit_jelly, rice, sheet_metal, vial, wallplugs, walnuts]
  preprocess: no_mask_no_rotation
backbone_config:
  smaller_edge_size: 368
  weights: IMAGENET1K_V1
protocol:
  shots: 2
  fixed_reference_manifest: configs/benchmarks/v7_evidence/E1_seeds/manifests/seed1_support_2.json
  warmup_iters: 0
method_config:
  input_size: 368
  reg_lambda: 0.3
  coreset_sampling_ratio: 0.15
  projection_eps: 0.9
  smooth_sigma: 4.0
evaluation:
  eval_segm: true
  pro_integration_limit: 0.05
  binary_postprocess: none
  condition_strata: true
output:
  save_anomaly_maps: false
  save_weights: false
