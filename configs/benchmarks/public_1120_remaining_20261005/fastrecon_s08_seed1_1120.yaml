method: fastrecon_paper
dataset: mvtec_ad2
backbone: fastrecon_resnet50
seed: 1
device: cuda:0
dataset_config:
  objects:
  - can
  - fabric
  - fruit_jelly
  - rice
  - sheet_metal
  - vial
  - wallplugs
  - walnuts
  preprocess: no_mask_no_rotation
  resolution: 1120
backbone_config:
  smaller_edge_size: 1120
  weights: IMAGENET1K_V1
  resolution_ablation: true
protocol:
  shots: 8
  fixed_reference_manifest: configs/benchmarks/public_v13_20260929/seed1_support_8.json
  warmup_iters: 0
method_config:
  input_size: 1120
  reg_lambda: 0.3
  coreset_sampling_ratio: 0.15
  projection_eps: 0.9
  smooth_sigma: 4.0
evaluation:
  eval_segm: true
  pro_integration_limit: 0.05
  binary_postprocess: none
  condition_strata: true
  cost_profile: true
  streaming: true
  inference_batch_size: 1
output:
  save_anomaly_maps: false
  save_weights: false
