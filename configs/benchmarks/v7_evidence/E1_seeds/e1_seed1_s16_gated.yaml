method: fusion_factorial
dataset: mvtec_ad2
backbone: dinov2_vitl14
seed: 1
dataset_config:
  preprocess: no_mask_no_rotation
backbone_config:
  smaller_edge_size: 672
  feature_layers:
  - 5
  - 11
  - 23
protocol:
  shots: 16
  warmup_iters: 1
  fixed_reference_manifest: configs/benchmarks/v7_evidence/E1_seeds/manifests/seed1_support_16.json
method_config:
  shallow_mode: gated
  variant: R1
  feature_layers:
  - 5
  - 11
  - 23
  resolutions:
  - 448
  - 672
  - 896
  - 1120
  bank_tokens_per_source: 256
  query_chunk_size: 128
  bank_bags: 4
  knn_k: 1
  score_normalization: tailscale
  layer_fusion: residual_spike
  layer_fusion_tau_mode: support_quantile
  layer_fusion_tau_q: 0.99
  layer_fusion_gamma: 1.0
  layer_fusion_shallow_idx: 0
  prediction_postprocess: component_quantile
  component_percentile: 99.0
  component_q: 1.0
  component_dilate_size: 0
  mechanism_audit: true
evaluation:
  streaming: true
  inference_batch_size: 1
  metric_contract: mvtec_ad2_float16_streaming_v1
  eval_segm: true
  eval_clf: false
  pro_integration_limit: 0.05
  fusion_diagnostic: true
output:
  save_anomaly_maps: false
  save_weights: false
