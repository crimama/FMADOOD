# Paired with RSG4 seed endpoint; source: configs/benchmarks/v7_evidence/E10_ad2_strata/e10_patchcore.yaml
method: patchcore
dataset: mvtec_ad2
backbone: dinov2_vitl14
seed: 2
device: cuda:1
dataset_config:
  objects:
  - can
  - fabric
  - fruit_jelly
  - rice
  - sheet_metal
  - vial
  - wallplugs
  - walnuts
  preprocess: no_mask_no_rotation
backbone_config:
  smaller_edge_size: 672
  feature_layers:
  - 5
  - 11
  - 17
  - 23
protocol:
  shots: 16
  fixed_reference_manifest: configs/benchmarks/v7_evidence/E1_seeds/manifests/seed2_support_16.json
  warmup_iters: 2
method_config:
  coreset_sampling_ratio: 1.0
  knn_metric: L2_normalized
  k_neighbors: 1
  faiss_on_cpu: false
evaluation:
  eval_segm: true
  pro_integration_limit: 0.05
  binary_postprocess: none
  condition_strata: true
