# Paired with RSG4 seed endpoint; source: configs/benchmarks/v7_evidence/E11_shift_shots/e11_superad_s02.yaml
method: superad
dataset: mvtec_ad2
backbone: dinov2_vitl14
seed: 2
device: cuda:0
dataset_config:
  objects:
  - can
  - fabric
  - fruit_jelly
  - rice
  - sheet_metal
  - vial
  - wallplugs
  - walnuts
  preprocess: no_mask_no_rotation
backbone_config:
  smaller_edge_size: 672
  feature_layers:
  - 5
  - 11
  - 17
  - 23
protocol:
  shots: 2
  fixed_reference_manifest: configs/benchmarks/v7_evidence/E1_seeds/manifests/seed2_support_2.json
  warmup_iters: 2
method_config:
  knn_metric: L2_normalized
  k_neighbors: 1
  faiss_on_cpu: false
  mask_ref_images: false
evaluation:
  eval_segm: true
  pro_integration_limit: 0.05
  binary_postprocess: none
  condition_strata: true
