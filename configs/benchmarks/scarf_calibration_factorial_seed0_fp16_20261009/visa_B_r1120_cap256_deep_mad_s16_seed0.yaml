method: reference_matching_fast
dataset: visa
backbone: dinov2_vitl14
seed: 0
dataset_config:
  preprocess: no_mask_no_rotation
backbone_config:
  smaller_edge_size: 672
  feature_layers:
  - 5
  - 11
  - 23
  feature_output_device: model
  inference_autocast_dtype: fp16
protocol:
  shots: 16
  warmup_iters: 1
  fixed_reference_manifest: configs/benchmarks/table5_rsg4_20261001/manifests/visa_seed0_s16.json
method_config:
  variant: R1
  feature_layers:
  - 5
  - 11
  - 23
  resolutions:
  - 1120
  bank_tokens_per_source: 256
  query_chunk_size: 512
  bank_bags: 4
  knn_k: 1
  score_normalization: mad
  layer_fusion: residual_spike
  layer_fusion_tau_mode: support_quantile
  layer_fusion_tau_q: 0.99
  layer_fusion_gamma: 0.125
  layer_fusion_shallow_idx: 0
  prediction_postprocess: component_quantile
  component_percentile: 99.0
  component_q: 1.0
  component_dilate_size: 0
  noise_guard: true
  noise_guard_k: 9.0
  noise_guard_action: lowres
  noise_guard_resolutions:
  - 1120
  fast_reuse_calibration_bank: true
  fast_shared_bag_distances: true
  image_score_aggregation: top1pct
  image_score_source: final
  image_score_candidates: false
  ablation_shallow_mode: 'off'
  tail_quantile: 0.95
  ablation_bank_audit: true
evaluation:
  streaming: true
  inference_batch_size: 1
  metric_contract: mvtec_ad2_float16_streaming_v1
  eval_segm: true
  eval_clf: false
  pro_integration_limit: 0.05
  cost_profile: false
  fusion_diagnostic: false
  condition_strata: false
output:
  save_anomaly_maps: false
  save_weights: false
